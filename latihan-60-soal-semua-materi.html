<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>60 Soal Latihan IPA SMP</title>
<style>
:root{--bg:#e9f5ef;--s:#fff;--ink:#12372a;--mu:#4f6f62;--ln:#c5ddd0;--ac:#e0457b;--ai:#fff;--ok:#1f8a54;--okb:#d9f2e4;--bd:#c23a3a;--bdb:#fbe0e0;--nt:#f3f9f6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f2019;--s:#173026;--ink:#e4f4ec;--mu:#98b8a8;--ln:#2b4a3c;--ac:#ff7aa5;--ai:#2a0b17;--ok:#6fdc9f;--okb:#1b4733;--bd:#ff8f8f;--bdb:#4a2222;--nt:#1c3a2d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.55}
.w{max-width:680px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.5rem;line-height:1.25;margin:18px 0 6px}.sub{margin:0;color:var(--mu)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;margin:14px 0 18px}
.tr{flex:1;height:10px;border-radius:99px;background:var(--ln);overflow:hidden}.fl{height:100%;width:0;background:var(--ac);transition:width .3s}.sc{font-weight:700;white-space:nowrap}
h2{font-size:1.1rem;margin:28px 0 12px;color:var(--ac)}
.q{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}.q p{margin:0 0 12px;font-weight:600}
.n{display:inline-block;min-width:2em;color:var(--ac);font-weight:800}
.o{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}.o:focus-visible,.b:focus-visible{outline:3px solid var(--ac);outline-offset:2px}.o:disabled{cursor:default}
.o.r{border-color:var(--ok);background:var(--okb)}.o.x{border-color:var(--bd);background:var(--bdb)}
.e{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--nt);font-size:.95rem;display:none}.e.on{display:block}
.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--ac);color:var(--ai)}
.res{background:var(--s);border:2px solid var(--ac);border-radius:14px;padding:20px;text-align:center;margin-top:24px;display:none}.res.on{display:block}
.big{font-size:2.6rem;font-weight:800;color:var(--ac);line-height:1.1}.pm{text-align:left;margin:12px auto;max-width:360px}
@media (prefers-reduced-motion:reduce){.fl{transition:none}}
</style></head><body><div class="w">
<h1>60 Soal Latihan IPA SMP</h1><p class="sub">5 materi, masing-masing 12 soal pilihan ganda, urut dari materi 1 sampai 5</p>
<div class="bar"><div class="tr"><div class="fl" id="fl"></div></div><div class="sc" id="sc">Benar 0/60</div></div>
<div id="mc"></div>
<div class="res" id="res"><div class="big" id="fin"></div><p id="msg"></p><div class="pm" id="pm"></div><button class="b" onclick="reset()">Ulangi latihan</button></div>
</div>
<script>
const T=["Materi 1: Struktur Sel, Transpor Membran & Bioteknologi","Materi 2: Fotosintesis, Respirasi & Homeostasis","Materi 3: Hukum Newton, Energi & Tekanan Hidrostatis","Materi 4: Kalor, Perubahan Wujud & Rangkaian Listrik","Materi 5: Wujud Zat, Atom/Molekul & Pencemaran"];
const Q=[
["Organel penghasil energi (ATP) adalah...",["Ribosom","Mitokondria","Lisosom","Badan Golgi"],1,"Mitokondria adalah pembangkit energi sel."],
["Bagian yang hanya ada pada sel tumbuhan adalah...",["Mitokondria","Inti sel","Kloroplas","Membran sel"],2,"Kloroplas untuk fotosintesis, hanya ada di sel tumbuhan."],
["Pusat pengatur kegiatan sel adalah...",["Nukleus","Vakuola","Ribosom","Lisosom"],0,"Nukleus menyimpan DNA dan mengatur sel."],
["Tempat sintesis protein adalah...",["Lisosom","Ribosom","Vakuola","Badan Golgi"],1,"Ribosom merakit protein."],
["Difusi adalah perpindahan zat dari...",["Rendah ke tinggi dengan energi","Tinggi ke rendah tanpa energi","Tinggi ke rendah dengan energi","Rendah ke tinggi tanpa energi"],1,"Difusi mengikuti gradien konsentrasi dan tidak butuh energi (transpor pasif)."],
["Osmosis adalah...",["Perpindahan gas","Perpindahan air lewat membran semipermeabel","Perpindahan garam","Perpindahan energi"],1,"Osmosis khusus untuk air."],
["Transpor aktif berbeda dari difusi karena...",["Hanya pada hewan","Tidak butuh energi","Butuh energi (ATP)","Hanya berupa osmosis"],2,"Transpor aktif memakai ATP, dari konsentrasi rendah ke tinggi."],
["Sel darah merah di larutan garam pekat akan...",["Membengkak","Mengerut","Pecah","Tetap normal"],1,"Air keluar dari sel sehingga sel mengerut."],
["Contoh bioteknologi konvensional adalah...",["Pembuatan tempe","Kloning","Insulin rekayasa genetika","Tanaman transgenik"],0,"Tempe dibuat dengan fermentasi tanpa rekayasa genetika."],
["Mikroorganisme pembuat yogurt adalah...",["Rhizopus","Acetobacter","Saccharomyces","Lactobacillus"],3,"Lactobacillus mengubah laktosa jadi asam laktat."],
["Contoh bioteknologi modern adalah...",["Pembuatan tape","Insulin dari bakteri hasil rekayasa genetika","Pembuatan kecap","Pembuatan yogurt"],1,"Rekayasa genetika termasuk bioteknologi modern."],
["Fungsi membran sel adalah...",["Menghasilkan energi","Membuat protein","Mengatur keluar masuk zat","Menyimpan DNA"],2,"Membran bersifat selektif permeabel."],
["Fotosintesis terjadi di...",["Mitokondria","Kloroplas","Ribosom","Nukleus"],1,"Kloroplas berisi klorofil."],
["Hasil fotosintesis adalah...",["Glukosa dan O₂","CO₂ dan air","Amilum dan CO₂","ATP dan air"],0,"6CO₂ + 6H₂O + cahaya → C₆H₁₂O₆ + 6O₂."],
["Amilum pada daun dibuktikan dengan...",["Benedict","Air kapur","Iodin","Biuret"],2,"Iodin menjadi biru kehitaman jika ada amilum."],
["Reaksi terang terjadi di...",["Stroma","Grana","Sitoplasma","Matriks mitokondria"],1,"Reaksi terang di grana, reaksi gelap di stroma."],
["Percobaan gelembung O₂ pada Hydrilla dilakukan oleh...",["Mendel","Pasteur","Hooke","Ingenhousz"],3,"Ingenhousz membuktikan tumbuhan air menghasilkan O₂ di tempat terang."],
["ATP yang dihasilkan respirasi aerob sekitar...",["36-38","2","4","100"],0,"Aerob 36-38 ATP, anaerob hanya 2 ATP."],
["Fermentasi ragi menghasilkan...",["Asam laktat","Alkohol dan CO₂","Air dan O₂","Glukosa"],1,"Ragi menghasilkan alkohol dan CO₂."],
["Otot pegal karena penumpukan...",["Alkohol","CO₂","Asam laktat","Glukosa"],2,"Respirasi anaerob otot menghasilkan asam laktat."],
["CO₂ hasil respirasi dibuktikan dengan...",["Iodin","Benedict","Lakmus","Air kapur"],3,"CO₂ membuat air kapur keruh."],
["Hormon penurun gula darah adalah...",["Insulin","Glukagon","Adrenalin","Tiroksin"],0,"Insulin menurunkan, glukagon menaikkan gula darah."],
["Pengatur suhu tubuh di otak adalah...",["Otak kecil","Otak besar","Hipotalamus","Sumsum tulang belakang"],2,"Hipotalamus bekerja seperti termostat."],
["Saat suhu panas, tubuh akan...",["Menggigil","Pembuluh darah menyempit","Berkeringat dan pembuluh darah melebar","Bulu kuduk berdiri"],2,"Keringat dan pelebaran pembuluh darah melepas panas."],
["Benda diam tetap diam jika...",["Resultan gaya nol","Massanya kecil","Ada gesekan","Ada gaya ke atas"],0,"Hukum Newton I (inersia): ΣF = 0."],
["Benda 5 kg, percepatan 4 m/s². Gayanya...",["9 N","20 N","1,25 N","54 N"],1,"F = m × a = 5 × 4 = 20 N."],
["Berat benda bermassa 30 kg (g = 10) adalah...",["30 N","3 N","300 N","3.000 N"],2,"w = m × g = 30 × 10 = 300 N."],
["Roket meluncur karena gas disemburkan ke bawah. Ini sesuai...",["Newton I","Newton III","Newton II","Archimedes"],1,"Aksi-reaksi = Newton III."],
["Ek benda 2 kg berkecepatan 6 m/s adalah...",["36 J","72 J","12 J","6 J"],0,"Ek = ½ × 2 × 36 = 36 J."],
["Ep benda 5 kg pada ketinggian 4 m (g = 10) adalah...",["20 J","200 J","100 J","2.000 J"],1,"Ep = m × g × h = 5 × 10 × 4 = 200 J."],
["Benda jatuh dari 20 m. Kecepatan di tanah (g = 10)...",["20 m/s","10 m/s","40 m/s","200 m/s"],0,"v² = 2gh = 400, jadi v = 20 m/s."],
["Usaha 1.000 J dalam 10 detik menghasilkan daya...",["10 W","1.000 W","10.000 W","100 W"],3,"P = W ÷ t = 1.000 ÷ 10 = 100 W."],
["Tekanan hidrostatis pada kedalaman 2 m air adalah...",["2.000 Pa","20.000 Pa","200.000 Pa","12 Pa"],1,"P = ρgh = 1.000 × 10 × 2 = 20.000 Pa."],
["Dongkrak: F₁ = 10 N, A₁ = 2 cm², A₂ = 50 cm². F₂ = ...",["25 N","100 N","250 N","500 N"],2,"F₂ = 10 × 50 ÷ 2 = 250 N."],
["Gaya apung benda 0,001 m³ tercelup di air...",["10 N","1 N","100 N","1.000 N"],0,"Fa = ρgV = 1.000 × 10 × 0,001 = 10 N."],
["Satuan usaha adalah...",["Watt","Newton","Joule","Pascal"],2,"Usaha dan energi dalam Joule."],
["Kalor merambat tanpa zat perantara disebut...",["Radiasi","Konduksi","Konveksi","Evaporasi"],0,"Contoh radiasi: panas matahari."],
["50°C sama dengan...",["223 K","323 K","273 K","50 K"],1,"K = °C + 273 = 323 K."],
["Kalor untuk menaikkan suhu 2 kg air sebesar 5°C...",["4.200 J","8.400 J","42.000 J","420.000 J"],2,"Q = 2 × 4.200 × 5 = 42.000 J."],
["Perubahan wujud yang melepas kalor adalah...",["Melebur","Menguap","Menyublim","Mengembun"],3,"Mengembun dan membeku melepas kalor."],
["Suhu tetap saat es melebur karena...",["Kalor hilang ke udara","Kalor dipakai mengubah wujud","Es tidak menyerap kalor","Termometer rusak"],1,"Kalor dipakai mengubah wujud, bukan menaikkan suhu."],
["Kalor untuk melebur 3 kg es (L = 336.000 J/kg)...",["1.008.000 J","336.000 J","672.000 J","112.000 J"],0,"Q = m × L = 3 × 336.000."],
["200 g air 60°C dicampur 200 g air 20°C. Suhunya...",["30°C","40°C","80°C","20°C"],1,"Massa sama, jadi rata-rata = 40°C."],
["Hambatan 4 Ω dialiri 5 A. Tegangannya...",["1,25 V","9 V","20 V","0,8 V"],2,"V = I × R = 5 × 4 = 20 V."],
["Hambatan 3 Ω, 5 Ω, 2 Ω seri. Totalnya...",["30 Ω","1 Ω","3,3 Ω","10 Ω"],3,"Seri dijumlahkan: 3 + 5 + 2 = 10 Ω."],
["Dua hambatan 4 Ω disusun paralel. Totalnya...",["8 Ω","16 Ω","2 Ω","4 Ω"],2,"1/Rp = 1/4 + 1/4 = 2/4, Rp = 2 Ω."],
["Voltmeter dipasang secara...",["Seri","Paralel","Dalam baterai","Tidak dipasang"],1,"Voltmeter paralel, amperemeter seri."],
["Lampu 50 W menyala 20 jam memakai energi...",["1 kWh","0,1 kWh","10 kWh","1.000 kWh"],0,"0,05 kW × 20 jam = 1 kWh."],
["Partikel zat cair...",["Rapat dan hanya bergetar","Agak renggang dan bisa bergeser","Sangat renggang dan bebas","Tidak bergerak"],1,"Zat cair berubah bentuk mengikuti wadah."],
["Massa 600 g, volume 200 cm³. Massa jenisnya...",["0,3 g/cm³","30 g/cm³","3 g/cm³","120 g/cm³"],2,"ρ = 600 ÷ 200 = 3 g/cm³."],
["ρ = 800 kg/m³, V = 3 m³. Massanya...",["266 kg","803 kg","24.000 kg","2.400 kg"],3,"m = ρ × V = 800 × 3."],
["Benda ρ = 700 kg/m³ di air akan...",["Terapung","Tenggelam","Melayang","Menguap"],0,"ρ benda lebih kecil dari ρ air."],
["Nomor atom 9, nomor massa 19. Neutronnya...",["9","19","28","10"],3,"Neutron = 19 − 9 = 10."],
["Atom netral dengan 15 proton punya elektron...",["0","30","15","7"],2,"Elektron = proton = 15."],
["Contoh senyawa adalah...",["O₂","H₂O","Fe","Au"],1,"H₂O terdiri dari unsur H dan O."],
["Jumlah atom pada 2 molekul H₂O adalah...",["3","4","6","2"],2,"Satu H₂O = 3 atom, 2 molekul = 6 atom."],
["Campuran heterogen adalah...",["Air gula","Air garam","Teh manis","Air dan pasir"],3,"Pasir tidak larut, terlihat dua fase."],
["Hujan asam disebabkan gas...",["O₂","SO₂ dan NOx","N₂","Uap air"],1,"Berasal dari asap pabrik dan kendaraan."],
["Eutrofikasi ditandai dengan...",["Eceng gondok dan alga tumbuh berlebihan","Ikan bertambah","Air makin jernih","Air menguap"],0,"Limbah bernutrisi menghabiskan oksigen air."],
["Contoh Recycle adalah...",["Membawa tas sendiri","Botol bekas jadi pot","Mengolah plastik bekas jadi barang baru","Membuang sampah sembarangan"],2,"Recycle: diolah jadi barang baru."]
];
const L="ABCD",mc=document.getElementById("mc");let ans=0,ok=0,per=[0,0,0,0,0];
function build(){mc.innerHTML="";Q.forEach((it,i)=>{if(i%12==0)mc.insertAdjacentHTML("beforeend",`<h2>${T[i/12]}</h2>`);
const d=document.createElement("div");d.className="q";d.innerHTML=`<p><span class="n">${i+1}.</span>${it[0]}</p>`+it[1].map((t,j)=>`<button class="o" data-q="${i}" data-j="${j}"><b>${L[j]}.</b><span>${t}</span></button>`).join("")+`<div class="e" id="e${i}"></div>`;mc.appendChild(d)})}
mc.addEventListener("click",ev=>{const b=ev.target.closest(".o");if(!b)return;const i=+b.dataset.q,j=+b.dataset.j,it=Q[i],bs=mc.querySelectorAll(`.o[data-q="${i}"]`);
bs.forEach(x=>x.disabled=true);bs[it[2]].classList.add("r");const g=j==it[2];if(g){ok++;per[Math.floor(i/12)]++}else b.classList.add("x");
const e=document.getElementById("e"+i);e.innerHTML=(g?"<b>Benar!</b> ":`<b>Kurang tepat.</b> Jawaban: ${L[it[2]]}. `)+it[3];e.classList.add("on");ans++;up()});
function up(){document.getElementById("fl").style.width=ans/Q.length*100+"%";document.getElementById("sc").textContent=`Benar ${ok}/${Q.length}`;
if(ans==Q.length){const p=Math.round(ok/Q.length*100);document.getElementById("fin").textContent=p;
document.getElementById("msg").textContent=p>=80?"Mantap! Kamu siap ulangan.":p>=60?"Lumayan! Ulangi materi yang nilainya masih rendah.":"Baca ulang materinya dulu, lalu coba lagi. Pasti bisa!";
document.getElementById("pm").innerHTML=per.map((v,k)=>`<div>Materi ${k+1}: <b>${v}/12</b></div>`).join("");
const r=document.getElementById("res");r.classList.add("on");r.scrollIntoView({behavior:"smooth",block:"center"})}}
function reset(){ans=0;ok=0;per=[0,0,0,0,0];build();document.getElementById("res").classList.remove("on");up();window.scrollTo({top:0,behavior:"smooth"})}
build();up();
</script></body></html>
